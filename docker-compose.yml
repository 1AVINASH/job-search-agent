services:
  backend:
    image: job_search_agent:latest
    build:
      context: .
    container_name: job_search_agent
    ports:
      - "9000:8000"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PORT=9000
      - TZ=Asia/Kolkata # Set the timezone to IST
    command: uv run main.py  # Matches your bash script
